name: BlurpWorld
version: '1.21.8-0.1.0-SNAPSHOT'
main: dev.blurpworld.plugin.BlurpWorldPlugin
api-version: '1.21'
load: STARTUP
authors: [bloup]
description: Controls compressed memory worlds and snapshots on BlurpWorld Paper.
commands:
  blurpworld:
    aliases: [bw]
    description: Manages BlurpWorld memory worlds and snapshots.
    usage: /blurpworld <create|snapshot|restore|unload|list|stats>
    permission: blurpworld.admin
permissions:
  blurpworld.admin:
    default: op
