name: BlurpWorld
version: '26.2-0.2.0-SNAPSHOT'
main: dev.blurpworld.plugin.BlurpWorldPlugin
api-version: '26.2'
load: STARTUP
authors: [bloup]
description: Controls compressed memory worlds and snapshots on BlurpWorld Paper.
commands:
  blurpworld:
    aliases: [bw]
    description: Manages BlurpWorld memory worlds and snapshots.
    usage: /blurpworld <create|snapshot|rename|restore|unload|list|stats|import|export|tp|reload>
    permission: blurpworld.admin
permissions:
  blurpworld.admin:
    default: op
